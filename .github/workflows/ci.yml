name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 在 2025-09 已 deprecated；用 Node 22（最新 LTS）
          node-version: "22"
          # 不设 cache: 仓库没跟踪 package-lock.json（.gitignore 排除了），
          # setup-node 的 cache 选项会因找不到 lock file 直接失败。
          # 项目只有 vitest + jsdom 两个 devDep，每次重装也就几秒。

      - name: Install dependencies
        run: npm install

      - name: Syntax check JS files
        run: |
          for f in platform/js/*.js; do
            node --check "$f" || exit 1
          done

      - name: Run vitest
        run: npm test

      - name: Lint (optional)
        run: |
          echo "Add ESLint here when ready"
        continue-on-error: true