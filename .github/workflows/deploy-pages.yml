name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 自动启用 Pages（首次部署无需手动 Settings > Pages）
          enablement: true

      - name: Upload artifact (platform/ as site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./platform

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
