version: "3.8"

# ── Judge0 自部署（CE 社区版）───────────────────────────────
#
# 用法：
#   1. docker compose up -d
#   2. 等待初始化完成（约 1-2 分钟）
#   3. 在 platform/server/.env 设置：
#        JUDGE0_URL=http://localhost:2358
#   4. cd platform/server && node judge0-proxy.js
#
# 文档：https://github.com/judge0/judge0/blob/master/judge0.conf
# 注意：默认密码仅供本地开发，生产请改 AUTHN/REGISTRATION 段

services:
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0pass
      POSTGRES_DB: judge0
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    restart: unless-stopped

  server:
    image: judge0/judge0:1.13.1
    command: ["/api/docker-entrypoint.sh"]
    environment:
      # ── 数据库 ──
      POSTGRES_HOST: db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0pass
      # ── Redis ──
      REDIS_HOST: redis
      # ── 资源限制 ──
      ALLOWED_LANGUAGES_FOR_COMPILE: 54,50     # C++(54), C(50)
      ENABLE_COMPILER_OPTIONS: "true"
      ENABLE_COMMAND_LINE_ARGUMENTS: "true"
      ENABLE_SUBMISSION_DELETE: "true"
      # ── 安全 ──
      MAX_QUEUE_SIZE: 100
      MAX_CPU_TIME_LIMIT: 15
      MAX_EXTRA_CPU_TIME_LIMIT: 5
      MAX_WALL_TIME_LIMIT: 30
      MAX_MEMORY_LIMIT: 512000
      MAX_STACK_LIMIT: 128000
      MAX_MAX_PROCESSES_AND_OR_THREADS: 120
      MAX_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      MAX_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      MAX_MAX_FILE_SIZE: 4096
      # ── 认证（生产请改） ──
      ALLOW_ENABLE_NETWORK: "false"
      DISABLE_AUTHN: "true"
    depends_on:
      - db
      - redis
    ports:
      - "2358:2358"
    restart: unless-stopped

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0pass
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  db_data:
